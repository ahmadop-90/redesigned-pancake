name: RDP

on:
  workflow_dispatch:

permissions: write-all

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Set Password for Main GitHub User (runneradmin)
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force

          $username = "runneradmin"
          $password = "1"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Set-LocalUser -Name $username -Password $securePass
          
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

      - name: Apply Anti-Sleep Settings
        run: |
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -monitor-timeout-dc 0
          powercfg -change -standby-timeout-ac 0
          powercfg -change -standby-timeout-dc 0
          powercfg -h off

      - name: Install Browser Extensions & Policies (Only Instarem Blocked)
        run: |
          $chromePath = "HKLM:\SOFTWARE\Policies\Google\Chrome"
          if (-not (Test-Path $chromePath)) { New-Item -Path $chromePath -Force | Out-Null }
          
          New-ItemProperty -Path $chromePath -Name "DefaultGeolocationSetting" -Value 2 -PropertyType DWORD -Force | Out-Null
          New-ItemProperty -Path $chromePath -Name "PasswordManagerEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null

          $passBlockPath = "$chromePath\PasswordManagerBlocklist"
          if (-not (Test-Path $passBlockPath)) { New-Item -Path $passBlockPath -Force | Out-Null }
          New-ItemProperty -Path $passBlockPath -Name "1" -Value "instarem.com" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $passBlockPath -Name "2" -Value "*.instarem.com" -PropertyType String -Force | Out-Null

          $extensionPath = "$chromePath\ExtensionInstallForcelist"
          if (-not (Test-Path $extensionPath)) { New-Item -Path $extensionPath -Force | Out-Null }
          New-ItemProperty -Path $extensionPath -Name "1" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $extensionPath -Name "2" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          
          $edgePath = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist"
          if (-not (Test-Path $edgePath)) { New-Item -Path $edgePath -Force | Out-Null }
          New-ItemProperty -Path $edgePath -Name "1" -Value "pciakllldcajllepkbbihkmfkikheffb;https://edge.microsoft.com/extensionwebstorebase/v1/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePath -Name "2" -Value "gmgoamodcdcjnbaobigkjelfplakmdhh;https://edge.microsoft.com/extensionwebstorebase/v1/crx" -PropertyType String -Force | Out-Null

      - name: Install Macro Recorder, Configure Registry & Move Specific File
        shell: pwsh
        run: |
          $desktopPath = "C:\Users\Public\Desktop"
          $rarPath = "$desktopPath\ahmad.rar"
          $extractPath = "$desktopPath\ahmad_extracted"
          
          $directUrl = "https://drive.usercontent.google.com/download?id=1ADfqyxHUGgvlrgPJQA1weJ7pRiTM47wm&export=download&authuser=0"
          
          Write-Host "Downloading Macro Recorder..."
          Invoke-WebRequest -Uri $directUrl -OutFile $rarPath
          
          if (Test-Path $rarPath) { & "C:\Program Files\7-Zip\7z.exe" x $rarPath -o"$extractPath" -y }
          
          Write-Host "Installing Macro Recorder Setup..."
          $installerPath = "$extractPath\MacroRecorderSetup.exe"
          if (Test-Path $installerPath) {
              Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/quiet", "/NORESTART" -Wait
          }

          Write-Host "Registering Macro Recorder with Keys 113 and 112..."
          $regPath = "HKCU:\SOFTWARE\Jitbit\Macro Recorder"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          
          $serialKey = "HGCNNGujba4SdhQELI56YkubWcJe4MMhOw6mrqdA3WdWKp63lGmQgQSw"
          New-ItemProperty -Path $regPath -Name "Email" -Value "1" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "Code" -Value $serialKey -PropertyType String -Force | Out-Null
          
          New-ItemProperty -Path $regPath -Name "AbortPlayKey" -Value 113 -PropertyType DWORD -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "AbortPlayKeyMod" -Value 0 -PropertyType DWORD -Force | Out-Null
          
          New-ItemProperty -Path $regPath -Name "PausePlayKey" -Value 112 -PropertyType DWORD -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "PausePlayKeyMod" -Value 0 -PropertyType DWORD -Force | Out-Null
          
          New-ItemProperty -Path $regPath -Name "NumberOfPlaybacks" -Value 0 -PropertyType DWORD -Force | Out-Null

          Write-Host "Moving 'gg in.mcr' file to Desktop..."
          $targetFile = "$extractPath\gg in.mcr"
          if (Test-Path $targetFile) {
              Move-Item -Path $targetFile -Destination $desktopPath -Force
              Write-Host "Successfully moved 'gg in.mcr' to Desktop!"
          } else {
              Write-Warning "File 'gg in.mcr' not found in $extractPath!"
          }

          Write-Host "Downloading and Installing AnyDesk..."
          $anydeskUrl = "https://download.anydesk.com/AnyDesk.exe"
          $anydeskPath = "$env:TEMP\AnyDesk.exe"
          
          Invoke-WebRequest -Uri $anydeskUrl -OutFile $anydeskPath
          
          Start-Process -FilePath $anydeskPath -ArgumentList "--install", "C:\AnyDesk", "--silent", "--create-desktop-icon" -Wait
          
          Start-Sleep -Seconds 10
          
          Write-Host "Setting AnyDesk Password for Unattended Access..."
          cmd.exe /c "echo 1233aassA@ | C:\AnyDesk\AnyDesk.exe --set-password"

      - name: Set .mcr Default File Association
        shell: pwsh
        run: |
          $exePath = "C:\Program Files (x86)\MacroRecorder\MacroRecorder.exe"
          if (-not (Test-Path $exePath)) { $exePath = "C:\Program Files\MacroRecorder\MacroRecorder.exe" }

          New-Item -Path "Registry::HKEY_CLASSES_ROOT\.mcr" -Force | Out-Null
          Set-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\.mcr" -Name "(Default)" -Value "MacroRecorderFile" -Force
          New-Item -Path "Registry::HKEY_CLASSES_ROOT\MacroRecorderFile\DefaultIcon" -Force | Out-Null
          Set-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\MacroRecorderFile\DefaultIcon" -Name "(Default)" -Value "`"$exePath`",0" -Force
          New-Item -Path "Registry::HKEY_CLASSES_ROOT\MacroRecorderFile\shell\open\command" -Force | Out-Null
          Set-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\MacroRecorderFile\shell\open\command" -Name "(Default)" -Value "`"$exePath`" `"%1`"" -Force

      - name: Install Anti-Detect Browsers from Google Drive
        shell: pwsh
        run: |
          $desktopPath = "C:\Users\Public\Desktop"
          $browsersRarPath = "$desktopPath\browsers.rar"
          $browsersExtractPath = "$desktopPath\browsers_extracted"
          
          Write-Host "Installing gdown (Python tool for large Google Drive files)..."
          python -m pip install gdown
          
          Write-Host "Downloading Large Browsers RAR bypassing virus scan warning..."
          python -m gdown "1GNqmqUON9SDVC7id2Zn9VIp2GFCr-LtE" -O "$browsersRarPath"
          
          Write-Host "Extracting Browsers..."
          if (Test-Path $browsersRarPath) { 
              & "C:\Program Files\7-Zip\7z.exe" x $browsersRarPath -o"$browsersExtractPath" -y 
          }
          
          Write-Host "Installing AdsPower..."
          $adsPowerPath = "$browsersExtractPath\AdsPowerSetup.exe" 
          if (Test-Path $adsPowerPath) {
              Start-Process -FilePath $adsPowerPath -ArgumentList "/S", "/quiet" -Wait
              Write-Host "AdsPower Installed successfully."
          } else {
              Write-Host "AdsPowerSetup.exe not found in RAR!"
          }

          Write-Host "Setting up BitBrowser..."
          $bitBrowserPath = "$browsersExtractPath\BitBrowserSetup.exe" 
          if (Test-Path $bitBrowserPath) {
              Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$bitBrowserPath`" /S" -Wait
              Copy-Item -Path $bitBrowserPath -Destination "C:\Users\Public\Desktop\BitBrowser_Setup_Install_Me.exe" -Force
              Write-Host "BitBrowser Setup placed on Desktop."
          } else {
              Write-Host "BitBrowserSetup.exe not found in RAR!"
          }

      - name: Get AnyDesk ID After Browsers Setup
        shell: pwsh
        run: |
          Write-Host "Getting AnyDesk ID..."
          $anydeskId = cmd.exe /c "C:\AnyDesk\AnyDesk.exe --get-id"
          echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV

      - name: Save AnyDesk ID to GitHub Variable
        shell: pwsh
        run: |
          $token = "${{ secrets.GH_PAT }}".Trim()
          $headers = @{
              Authorization = "Bearer $token"
              Accept        = "application/vnd.github+json"
          }
          $varUrl  = "https://api.github.com/repos/${{ github.repository }}/actions/variables/ANYDESK_LIST"
          $runsUrl = "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress"

          $res = Invoke-RestMethod -Uri $varUrl -Headers $headers
          $activeRuns = Invoke-RestMethod -Uri $runsUrl -Headers $headers
          $activeIds = @($activeRuns.workflow_runs | ForEach-Object { "$($_.id)" })

          $map = @{}
          if ($res.value -and $res.value -ne "{}") {
              $obj = $res.value | ConvertFrom-Json
              $obj.PSObject.Properties | ForEach-Object {
                  if ($activeIds -contains $_.Name) {
                      $map[$_.Name] = $_.Value
                  }
              }
          }
          $map["$env:GITHUB_RUN_ID"] = "$($env:ANYDESK_ID)".Trim()
          $body = @{ name = "ANYDESK_LIST"; value = ($map | ConvertTo-Json -Compress) } | ConvertTo-Json
          Invoke-RestMethod -Uri $varUrl -Method Patch -Headers $headers -Body $body -ContentType "application/json"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-${{ github.run_number }} --accept-routes
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1)
              if ($tsIP) { $tsIP = $tsIP.Trim() }
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned. Exiting."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Save Tailscale IP to GitHub Variable
        shell: pwsh
        run: |
          $token = "${{ secrets.GH_PAT }}".Trim()
          $headers = @{
              Authorization = "Bearer $token"
              Accept        = "application/vnd.github+json"
          }
          $baseVarsUrl = "https://api.github.com/repos/${{ github.repository }}/actions/variables"
          $varUrl      = "$baseVarsUrl/RDP_IP_LIST"
          $runsUrl     = "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress"

          $activeRuns = Invoke-RestMethod -Uri $runsUrl -Headers $headers
          $activeIds  = @($activeRuns.workflow_runs | ForEach-Object { "$($_.id)" })

          $map = @{}
          $exists = $false
          try {
              $res = Invoke-RestMethod -Uri $varUrl -Headers $headers -Method Get
              $exists = $true
              if ($res.value -and $res.value -ne "{}") {
                  $obj = $res.value | ConvertFrom-Json
                  $obj.PSObject.Properties | ForEach-Object {
                      if ($activeIds -contains $_.Name) {
                          $map[$_.Name] = $_.Value
                      }
                  }
              }
          } catch {}

          $map["$env:GITHUB_RUN_ID"] = "$($env:TAILSCALE_IP)".Trim()
          $body = @{ name = "RDP_IP_LIST"; value = ($map | ConvertTo-Json -Compress) } | ConvertTo-Json

          if ($exists) {
              Invoke-RestMethod -Uri $varUrl -Method Patch -Headers $headers -Body $body -ContentType "application/json" | Out-Null
          } else {
              Invoke-RestMethod -Uri $baseVarsUrl -Method Post -Headers $headers -Body $body -ContentType "application/json" | Out-Null
          }

      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "TCP connection failed"; exit 1 }

      - name: Send Details to Discord
        shell: pwsh
        run: |
          $webhookUrl = "https://discord.com/api/webhooks/1568094406475645029/rl2bF7NQStf79NXvlRwBed1IXhnVYwNM_0Pc8elqq26Ec2lYsFT3JJ-iRJniW5CZm121"
          
          $msg = "**✅ RDP is Ready!**`n`n"
          $msg += "**🌐 Tailscale IP:** $env:TAILSCALE_IP`n"
          $msg += "**👤 RDP Username:** runneradmin`n"
          $msg += "**🔑 RDP Password:** 1`n`n"
          $msg += "**🖥️ AnyDesk ID:** $env:ANYDESK_ID`n"
          $msg += "**🔑 AnyDesk Pass:** 1233aassA@"
          
          $payload = @{ content = $msg } | ConvertTo-Json
          Invoke-RestMethod -Uri $webhookUrl -Method Post -ContentType "application/json" -Body $payload

      - name: Maintain Connection
        shell: pwsh
        run: |
          $code = '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);'
          $win = Add-Type -MemberDefinition $code -Name "Win32ShowWindow" -Namespace Win32Functions -PassThru
          Get-Process -Name "cmd", "pwsh", "powershell", "conhost", "WindowsTerminal" -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.MainWindowHandle -ne 0) {
                  $win::ShowWindow($_.MainWindowHandle, 0) | Out-Null
              }
          }

          Write-Host "`n=== CONNECTION INFO ==="
          Write-Host "RDP Address: $env:TAILSCALE_IP"
          Write-Host "RDP Username: runneradmin"
          Write-Host "RDP Password: 1"
          Write-Host "-----------------------"
          Write-Host "AnyDesk ID: $env:ANYDESK_ID"
          Write-Host "AnyDesk Pass: 1233aassA@"
          Write-Host "=======================`n"
          
          for ($i = 0; $i -lt 71; $i++) {
              Write-Host "[$(Get-Date)] RDP & AnyDesk Active"
              Start-Sleep -Seconds 300
          }
